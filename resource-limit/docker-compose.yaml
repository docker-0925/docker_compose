#version: "3.8"

services:
  nginx-resource:
    container_name: nginx-resource #disarankan sama dgn atribut diatas
    image: nginx:latest
    ports:
      - protocol: tcp
        published: 8080
        target: 80
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 50M
        limits:
          cpus: "0.5"
          memory: 100M